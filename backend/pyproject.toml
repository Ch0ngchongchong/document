# 딱 재고 백엔드 (FastAPI)
# 버전 번호는 아직 실제로 설치해 확인하지 않았다.
# 설치 후 `pip freeze` 결과로 고정하고, 돌려 본 명령은 docs/decisions/scaffold-log.md에 남긴다.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddakjaego-backend"
version = "0.1.0"
description = "딱 재고 — 거래명세서 판독·입고 확인 서비스 백엔드"
# 확인 필요: 팀원 5명 Mac의 `python3 --version`
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",       # 실행 서버
    "python-multipart",        # 사진·PDF 업로드(UploadFile), US-03
    "sqlalchemy>=2.0",         # 2.0 방식, 동기로 사용
    "psycopg[binary]>=3.1",    # PostgreSQL 드라이버 (postgresql+psycopg://)
    "alembic",                 # DB 마이그레이션
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",                   # FastAPI TestClient에 필요
    "ruff",
]

# 서버 코드는 backend/app/ 에 둔다 (폴더 이름은 팀 확인 필요).
# tests/, alembic/ 이 패키지로 잡혀 설치가 실패하지 않게 app만 포함한다.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, N: 이름 규칙 (CODE-STYLE 1번)
select = ["E", "F", "I", "N"]
